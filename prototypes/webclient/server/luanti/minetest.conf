# Luanti-Server für den Web-Client-Prototyp (Beispielwelt)
# Wird in den Container nach /etc/minetest/minetest.conf eingehängt. Geheimnisse stehen NICHT hier,
# sondern kommen als Umgebungsvariablen aus der Datei .env neben docker-compose.yml.

server_name = MINTforge-Labor (Prototyp)
server_description = Prototyp, nicht für den Unterricht freigegeben
server_announce = false
port = 30000
max_users = 30

# Ältere Clients zulassen: Der WebAssembly-Client aus minetest-wasm (5bfae52) ist ein 5.18.0-dev-Stand mit
# Protokoll 53, der Server 5.18.0 spricht Protokoll 54 und akzeptiert ab 37.
strict_protocol_version_checking = false

# Lernwelt: kein Schaden, kein PvP, keine freie Registrierung (das übernimmt mintforge_quest mit Token)
enable_damage = false
enable_pvp = false
creative_mode = false
default_privs = interact, shout
disallow_empty_password = true

# Flache, leere Laborwelt
mg_name = flat
mg_flags = nocaves, nodungeons, light, nodecorations, nobiomes, noores
mgflat_spflags = nolakes, nohills, nocaverns
mgflat_ground_level = 8
static_spawnpoint = 0, 9, 0

# Speicher sparen (die Werte aus minetest-wasm für den Browser)
max_block_send_distance = 5
max_block_generate_distance = 5

# HTTP nur für die MINTforge-Mod
secure.enable_security = true
secure.http_mods = mintforge_quest

# Einstellungen der Mod (siehe mods/mintforge_quest/init.lua)
mintforge.ergebnis_url = http://ergebnis:8080/ergebnis
mintforge.welt_id = prototyp
mintforge.quest_flaeche = 24
mintforge.token_fenster = 86400
# Pseudonyme mit Lehrkraft-Rechten, durch Komma getrennt (Beispiel, erfundenes Pseudonym)
mintforge.lehrkraefte = Lehrkraft_01
